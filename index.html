<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>論理回路ドリル（試作 v0.7）</title>
<style>
:root{--bg:#f7f8fa;--fg:#14171c;--sub:#5b6472;--card:#fff;--line:#d6dbe3;--acc:#1d4ed8;--on:#c2410c;--off:#7b8494;--ok:#15803d;--ng:#b42318;--soft:#eef2ff;font-size:16px}
[data-theme=dark]{--bg:#14161a;--fg:#eef0f4;--sub:#a7afbd;--card:#1d2027;--line:#353a45;--acc:#8ab4ff;--on:#fb923c;--off:#8a93a3;--ok:#4ade80;--ng:#f87171;--soft:#232a3b}
[data-font=s]{font-size:14px}[data-font=l]{font-size:19px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.7}
#app{max-width:820px;margin:0 auto;padding:0 14px 40px}
header{background:var(--bg);padding:10px 0 6px;border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:1.15rem}.tag{font-size:.75rem;font-weight:600;margin-left:8px;padding:1px 8px;border:1px solid var(--line);border-radius:99px;color:var(--sub)}
.prefs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
nav{display:flex;gap:4px;margin-top:4px}
.tab{flex:1}
.tab[aria-current=page]{background:var(--acc);color:#fff;border-color:var(--acc)}
[data-theme=dark] .tab[aria-current=page]{color:#111}
.draft{margin:6px 0 0;font-size:.85rem;background:var(--soft);border-left:4px solid var(--acc);padding:4px 10px}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:44px;cursor:pointer}
button:hover{border-color:var(--acc)}
button:focus-visible,[tabindex]:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button:disabled{cursor:default}
.primary{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
[data-theme=dark] .primary{color:#111}
.ghost{background:transparent}
.danger{border-color:var(--ng);color:var(--ng)}
h1{font-size:1.4rem;margin:16px 0 8px}h2{font-size:1.1rem;margin:18px 0 8px}
.modes{display:grid;gap:10px;margin-top:12px}
.modes button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:12px 16px}
.modes small{font-weight:400;opacity:.9}
.progress{font-weight:700}
.list{list-style:none;padding:0;margin:8px 0;display:grid;gap:6px}
.row{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left}
.row.static{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.meta{color:var(--sub);font-size:.85rem;white-space:nowrap}
.empty{color:var(--sub)}
table{border-collapse:collapse;margin:6px 0;background:var(--card)}
th,td{border:1px solid var(--line);padding:4px 10px;text-align:center}
.tt .o{font-weight:800}.tt tr.cur{outline:2px solid var(--acc);outline-offset:-2px}.mark{border:none;background:var(--bg);color:var(--acc);font-weight:700}
.stat th[scope=row]{text-align:left}
.logbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.confirm{margin-top:10px;padding:10px;border:2px solid var(--ng);border-radius:10px}
.confirm button{margin-right:8px}
footer{margin-top:30px;font-size:.8rem;color:var(--sub)}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.count{font-weight:700}
.tags span{display:inline-block;font-size:.8rem;border:1px solid var(--line);border-radius:99px;padding:0 10px;margin-right:6px}
.tags .adv{border-color:var(--on);color:var(--on);font-weight:700}
.qtitle{font-size:1.25rem}
.goal{color:var(--sub);margin-top:0}
.step,.result{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 14px 12px;margin:12px 0}
.no{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;background:var(--acc);color:#fff;font-size:.85rem;margin-right:8px}
[data-theme=dark] .no{color:#111}
.small{font-size:.85rem;color:var(--sub)}
.qtext{font-weight:700;font-size:1.05rem}
.choices{display:grid;gap:8px}
.choice{display:flex;gap:10px;align-items:center;text-align:left;width:100%}
.choice .key{font-weight:800;color:var(--sub)}
.choice.right{border:3px solid var(--ok)}.choice.wrong{border:3px dashed var(--ng)}
.mk{font-weight:900;font-size:1.2rem;width:1.2em}
.choice.right .mk{color:var(--ok)}.choice.wrong .mk{color:var(--ng)}
.judge{font-size:1.15rem;font-weight:800;display:flex;align-items:center;gap:10px}
.judge .big{font-size:2rem}.judge.ok{color:var(--ok)}.judge.ng{color:var(--ng)}
.next{margin-top:10px;width:100%}
.result:focus{outline:3px solid var(--acc)}
.simbar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:6px 0}
.seg{display:inline-flex;gap:4px}.seg button[aria-pressed=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
[data-theme=dark] .seg button[aria-pressed=true]{color:#111}
.canvas{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
svg.circuit{width:100%;height:auto;display:block;max-height:420px}
.gl canvas{display:block;width:100%;touch-action:none}
.inrow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.inb{min-width:84px;font-weight:700}.inb.on{border:3px solid var(--on)}.inb.off{border:1px dashed var(--off)}
.live{font-weight:800}
.wire{fill:none;stroke-linejoin:round}
.w1{stroke:var(--on);stroke-width:4}
.w0{stroke:var(--off);stroke-width:2;stroke-dasharray:6 4}
.flow{fill:none;stroke:#fff;stroke-width:2;stroke-dasharray:3 17;opacity:.9;animation:flow 1s linear infinite}
[data-motion=off] .flow{display:none}
@keyframes flow{to{stroke-dashoffset:-20}}
@media (prefers-reduced-motion:reduce){.flow{animation:none;display:none}}
.body{fill:var(--card);stroke:var(--fg);stroke-width:2.2}
.gname{font-size:12px;fill:var(--sub)}
.lbl{font-size:15px;font-weight:700;fill:var(--fg)}
.val{font-size:16px;font-weight:800}
.innode{cursor:pointer}
.innode circle{stroke-width:3}
.innode.on circle{fill:var(--on);stroke:var(--on)}.innode.on .val{fill:#fff}
.innode.off circle{fill:var(--card);stroke:var(--off);stroke-dasharray:4 3}.innode.off .val{fill:var(--fg)}
.innode:focus-visible circle{stroke:var(--acc);stroke-width:5}
.vbox.on{fill:var(--on)}.vbox.off{fill:var(--card);stroke:var(--off)}
.vtxt{font-size:14px;font-weight:800;fill:var(--fg)}
.vbox.on+.vtxt{fill:#fff}
.wave svg{width:100%;height:auto;max-height:260px}
.wline{fill:none;stroke:var(--acc);stroke-width:2.5}
.wv{font-size:11px;fill:var(--sub)}
.fig{margin:8px 0}.symbol{width:200px;height:auto}.symbol .wire{stroke-dasharray:none}
.kmap td.one{font-weight:900;border:3px solid var(--on)}
details{margin:6px 0}summary{cursor:pointer;min-height:44px;display:flex;align-items:center}
.desc{font-size:.9rem}
.junction{stroke:none}.junction.w1{fill:var(--on)}.junction.w0{fill:var(--off)}
/* ルビ：全部／タップ／なし */
rt{font-size:.5em;font-weight:400;letter-spacing:0}
[data-ruby=off] rt{display:none}
/* タップ表示：読みを隠すときは幅も取らない（語の間にすき間を作らない） */
[data-ruby=tap] ruby:not(.on):not(:hover) rt{display:none}
[data-ruby=tap] ruby:not(button ruby){cursor:help}
[data-ruby=all] .qtext,[data-ruby=all] .step p,[data-ruby=all] .result p,[data-ruby=all] .result li{line-height:2.1}
/* ルーブリック */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 14px 12px;margin:12px 0}
.card h2{margin-top:10px}
.next-step{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--soft)}
.table-scroll{overflow-x:auto;max-width:100%}
.rubric th[scope=row]{min-width:10em}
.lv{display:inline-block;font-weight:700;font-size:.85rem;padding:0 8px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.lv0{color:var(--sub)}.lv1{border-color:var(--off)}.lv2{border-color:var(--on);color:var(--on)}
.lv3{border-color:var(--acc);color:var(--acc)}.lv4{background:var(--ok);border-color:var(--ok);color:#fff}
[data-theme=dark] .lv4{color:#111}
.lv-sub{display:block;font-size:.75rem;color:var(--sub)}
details summary{cursor:pointer;margin:8px 0;min-height:44px;display:flex;align-items:center}
footer p{margin:4px 0}
@media (max-width:640px){
  .rubric,.rubric tbody,.rubric tr,.rubric th,.rubric td{display:block;width:100%}
  .rubric thead{display:none}
  .rubric tr{padding:8px 0;border-bottom:1px solid var(--line)}
  .rubric th[scope=row],.rubric td{border:0;padding:3px 0;text-align:left}
  .rubric td{display:flex;gap:8px;align-items:baseline}
  .rubric td::before{content:attr(data-label);width:5em;flex:none;color:var(--sub);font-size:.8rem}
  .rubric .lv-sub{display:inline}
  .rubric tr.unstarted td:not(:last-child){display:none}
}
/* 否定の上線と空欄の枠 */
.ov{border-top:1.5px solid currentColor;padding-top:1px;display:inline-block;line-height:1.25}
.ov .ov{padding-top:2px}
.blank{display:inline-block;min-width:3em;border:1.5px solid currentColor;padding:0 .6em;text-align:center;margin:0 .2em}
/* 本番ではこう出た */
.honban{margin-top:4px;border-style:dashed}
.honban:disabled{opacity:.6}
.honban-tag{border-color:var(--acc)!important;color:var(--acc);font-weight:700}
.pastfig{margin:8px 0}.pastfig .lines p{margin:2px 0}
.fig-svg{width:100%;max-width:420px;height:auto}.fig-svg.narrow{max-width:240px}
.fig-svg .line,.venn .line{fill:none;stroke:var(--fg);stroke-width:1.6}
.fig-svg .dot{fill:var(--fg)}
.fig-svg text,.wave text,.venn text{fill:var(--fg);font-size:14px}
.fig-svg .small,.venn .small{font-size:12px}
.wave{width:100%;max-width:440px;height:auto}
.wave .trace{fill:none;stroke:var(--fg);stroke-width:2.2}
.wave .tick{stroke:var(--sub);stroke-dasharray:2 3}
.wave .axis{font-size:11px;fill:var(--sub)}
.figtab{margin:6px 0}.figtab th,.figtab td{min-width:2.2em}
.kmap td.one{font-weight:800}
.sheet th{background:var(--soft)}
.figchoices .choice{align-items:flex-start}
.chfig{display:block;flex:1;min-width:0}
.chfig .wave{max-width:340px}
.chfig .symbol{width:160px}
.chfig table{background:transparent}
.mini-circuit{width:100%;max-width:360px;height:auto}
.mini-circuit .body{fill:var(--card);stroke:var(--fg);stroke-width:1.6}
.mini-circuit .lbl{fill:var(--fg);font-size:15px}
.wp{stroke:var(--fg);stroke-width:1.6;fill:none}
.junction.wp{fill:var(--fg);stroke:none}
.chven{display:flex;align-items:center;gap:10px}
.venn{width:110px;height:auto}
.venn .hatchbg{fill:var(--card)}.venn .hatch{stroke:var(--fg);stroke-width:1.6}
.venn .frame{stroke:var(--fg);stroke-width:1.6}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.source{margin-top:12px;font-size:.8rem;color:var(--sub);border-top:1px solid var(--line);padding-top:6px}
.source p{margin:2px 0}
.figtab.kmap td.one{outline:none;border:1px solid var(--line);background:transparent}
.mini-circuit .lbl{font-size:24px}
summary{list-style:none}summary::-webkit-details-marker{display:none}
summary::before{content:"▶";font-size:.75em;margin-right:.5em;color:var(--acc)}details[open]>summary::before{content:"▼"}
.gname,.circuit .lbl{paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.list .reason{margin:2px 0 0;padding:0 12px}
</style>
</head>

ら値を決められる", "level": "FE", "form": "値の選択", "text": "P，Q，R はいずれも命題である。命題 P の真理値は真であり，命題 (not P) or Q 及び命題 (not Q) or R のいずれの真理値も真であることが分かっている。Q，R の真理値はどれか。ここで，X or Y は X と Y の論理和，not X は X の否定を表す。", "text2": null, "fig": null, "fig2": null, "circuit": null, "preset": null, "choice_kind": "text", "choices": [{"c": "Q：偽　R：偽", "ok": false, "why": "Q が偽だと (not P) or Q が偽になる"}, {"c": "Q：偽　R：真", "ok": false, "why": "Q が偽だと (not P) or Q が偽になる"}, {"c": "Q：真　R：偽", "ok": false, "why": "R が偽だと (not Q) or R が偽になる"}, {"c": "Q：真　R：真", "ok": true, "why": ""}], "venn": null, "ex": {"mini": "not P が偽なので、(not P) or Q が真になるには Q が真でなければならない。", "reason": "P が真で (not P) or Q が真 → Q は真。Q が真で (not Q) or R が真 → R も真。", "miss": "or の片方が偽なら、もう片方は必ず真になることを使わない", "tips": "前から1つずつ値を決める。", "next": "次は「スプレッドシートの論理和」"}, "sources": ["平成31年度 春期 基本情報技術者試験 午前 問3"], "mod": "選択肢の表（Q と R の2列）を1行の文に直した", "note": "承認済み（2026-11-14）"}, {"id": "LC-K03", "hen": "2.基本ゲート", "topic": "論理和の条件", "goal": "「又は」の条件を論理和で書ける", "level": "ITパスポート", "form": "論理式の選択", "text": "表計算ソフトを用いて，二つの科目 X，Y の点数を評価して合否を判定する。それぞれの点数はワークシートのセル A2，B2 に入力する。合格判定条件 (1) 又は (2) に該当するときはセル C2 に“合格”，それ以外のときは“不合格”を表示する。セル C2 に入力する式はどれか。", "text2": null, "fig": {"kind": "steps", "lines": ["〔合格判定条件〕", "(1) 科目 X と科目 Y の合計が 120 点以上である。", "(2) 科目 X 又は科目 Y のうち，少なくとも一つが 100 点である。"]}, "fig2": {"kind": "sheet", "cols": ["", "A", "B", "C"], "rows": [["1", "科目 X", "科目 Y", "合否"], ["2", "50", "80", "合格"]]}, "circuit": null, "preset": null, "choice_kind": "text", "choices": [{"c": "IF(論理積((A2＋B2) ≧ 120, A2 ＝ 100, B2 ＝ 100), '合格', '不合格')", "ok": false, "why": "論理積だと3つの条件がすべて必要になる"}, {"c": "IF(論理積((A2＋B2) ≧ 120, A2 ＝ 100, B2 ＝ 100), '不合格', '合格')", "ok": false, "why": "論理積で、しかも合格と不合格が逆"}, {"c": "IF(論理和((A2＋B2) ≧ 120, A2 ＝ 100, B2 ＝ 100), '合格', '不合格')", "ok": true, "why": ""}, {"c": "IF(論理和((A2＋B2) ≧ 120, A2 ＝ 100, B2 ＝ 100), '不合格', '合格')", "ok": false, "why": "合格と不合格の順が逆"}], "venn": null, "ex": {"mini": "「(1) 又は (2)」はどちらか一つでも当てはまれば合格。だから論理和を使う。", "reason": "論理和の中の ll, "note": "承認済み（2026-11-14）"}, {"id": "LC-K06", "hen": "2.基本ゲート", "topic": "NANDだけでOR", "goal": "NANDの組合せでORを作れる", "level": "FE", "form": "論理式の選択", "text": "X と Y の否定論理積 X NAND Y は，NOT(X AND Y) として定義される。X OR Y を NAND だけを使って表した論理式はどれか。", "text2": null, "fig": null, "fig2": null, "circuit": null, "preset": null, "choice_kind": "text", "choices": [{"c": "((X NAND Y) NAND X) NAND Y", "ok": false, "why": "この式は X＋Y と一致しない（X=1, Y=1 で 1 にならない）"}, {"c": "(X NAND X) NAND (Y NAND Y)", "ok": true, "why": ""}, {"c": "(X NAND Y) NAND (X NAND Y)", "ok": false, "why": "X AND Y になる"}, {"c": "X NAND (Y NAND (X NAND Y))", "ok": false, "why": "X=1, Y=1 で 1 にならない"}], "venn": null, "ex": {"mini": "X NAND X は NOT X。否定した2つを NAND すると、ド・モルガンの法則で OR になる。", "reason": "(X NAND X) NAND (Y NAND Y) ＝ NOT(X̄・Ȳ) ＝ X＋Y。", "miss": "(X NAND Y) NAND (X NAND Y) を OR と思う。これは AND", "tips": "同じものを NAND に2つ入れると NOT。", "next": "次は「NAND素子の組合せ回路」"}, "sources": ["平成29年度 春期 基本情報技術者試験 午前 問3"], "mod": null, "note": "承認済み（2026-11-14）"}, {"id": "LC-K07", "hen": "3.組合せ回路", "topic": "NANDの組合せ", "goal": "NANDだけの回路の式を求められる", "level": "AP", "form": "論理式の選択", "text": "NAND 素子を用いた次の組合せ回路の出力 Z を表す式はどれか。ここで，論理式中の“・”は論理積，“＋”は論理和，“[[X]]”は X の否定を表す。", "text2": null, "fig": null, "fig2": null, "circuit": {"inputs": ["X", "Y"], "defs": [{"o": "G1", "g": "NAND", "a": ["X", "X"]}, {"o": "G2", "g": "NAND", "a": ["Y", "Y"]}, {"o": "Z", "g": "NAND", "a": ["G1", "G2"]}], "out": "Z"}, "preset": null, "choice_kind": "text", "choices": [{"c": "X・Y", "ok": false, "why": "X=1, Y=0 で Z=1 になるので AND ではない"}, {"c": "X＋Y", "ok": true, "why": ""}, {"c": "[[X・Y]]", "ok": false, "why": "NAND は左の2つを通す前の形"}, {"c": "[[X＋Y]]", "ok": false, "why": "NOR は X=0, Y=0 のときだけ 1"}], "venn": null, "ex": {"mini": "入力を2本ともつないだ NAND は NOT として働く。", "reason": "左の2つは X̄ と Ȳ。それを NAND すると ¬(X̄・Ȳ) ＝ X＋Y。", "miss": "最後の NAND だけを見て X・Y の否定と答える", "tips": "入力を束ねた NAND＝NOT。", "next": "次は「同じときに1を出す回路」"}, "sources": ["令和5年度 春期 応用情報技術者試験 午前 問21"], "mod": null, "note": "承認済み（2026-11-14）"}, {"id": "LC-K08", "hen": "3.組合せ回路", "topic": "論理一致の回路", "goal": "条件に合う回路を選べる", "level": "AP", "form": "等価な回路の選択", "text": "入力 X と Y の値が同じときにだけ，出力 Z に 1 を出力する回路はどれか。", "text2": null, "fig": null, "fig2": null, "circuit": null, "preset": null, "choice_kind": "circuit", "choices": [{"c": {"inputs": ["X", "Y"], "defs": [{"o": "G1", "g": "AND", "a": ["X", "Y"]}, {"o": "N1", "g": "NOT", "a": ["X"]}, {"o": "N2", "g": "NOT", "a": ["Y"]}, {"o": "G2", "g": "AND", "a": ["N1", "N2"]}, {"o": "Z", "g": "AND", "a": ["G1", "G2"]}], "out": "Z"}, "ok": false, "why": "どちらの組合せも同時には1にならないので、いつも0"}, {"c": {"inputs": ["X", "Y"], "defs": [{"o": "G1", "g": "OR", "a": ["X", "Y"]}, {"o": "N1", "g": "NOT", "a": ["X"]}, {"o": "N2", "g": "NOT", "a": ["Y"]}, {"o": "G2", "g": "OR", "a": ["N1", "N2"]}, {"o": "Z", "g": "OR", "a": ["G1", "G2"]}], "out": "Z"}, "ok": false, "why": "どれかが必ず1になるので、いつも1"}, {"c": {"inputs": ["X", "Y"], "defs": [{"o": "G1", "g": "NAND", "a": ["X", "Y"]}, {"o": "N1", "g": "NOT", "a": ["X"]}, {"o": "N2", "g": "NOT", "a": ["Y"]}, {"o": "G2", "g": "NAND", "a": ["N1", "N2"]}, {"o": "Z", "g": "NAND", "a": ["G1", "G2"]}], "out": "Z"}, "ok": true, "why": ""}, {"c": {"inputs": ["X", "Y"], "defs": [{"o": "G1", "g": "NOR", "a": ["X", "Y"]}, {"o": "N1", "g": "NOT", "a": ["X"]}, {"o": "N2", "g": "NOT", "a": ["Y"]}, {"o": "G2", "g": "NOR", "a": ["N1", "N2"]}, {"o": "Z", "g": "NOR", "a": ["G1", "G2"]}], "out": "Z"}, "ok": false, "why": "NOR の2段は X と Y が違うときに1（XOR）"}], "venn": null, "ex": {"mini": "X と Y が同じなのは「両方1」か「両方0」のとき。X・Y＋X̄・Ȳ を回路にする。", "reason": "ウは NAND を2段重ねた形で、X・Y＋X̄・Ȳ になる。", "miss": "AND と OR の形だけで判断し、2段目の働きを確かめない", "tips": "NAND の2段＝AND と OR の組合せ。", "next": "次は「回路の真理値表」"}, "sources": ["令和4年度 秋期 応用情報技術者試験 午前 問23"], "mod": null, "note": "承認済み（2026-11-14）"}, {"id": "LC-K09", "hen": "3.組合せ回路", "topic": "回路と真理値表", "goal": "回路を真理値表に直せる", "level": "FE", "form": "真理値表", "text": "次の回路の入力と出力の関係として，正しいものはどれか。", "text2": null, "fig": null, "fig2": null, "circuit": {"inputs": ["A"
